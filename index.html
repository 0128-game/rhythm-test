<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beat Blocks - Rhythm Editor Lite</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        header {
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            color: #ffaa00;
        }
        .controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }
        .controls-top label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .controls-top input[type="number"] {
            width: 50px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }
        /* グリッドエディターエリア (View) */
        #grid-editor {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            background: #141414;
            padding: 10px;
            border-radius: 8px;
        }
        .cell {
            background: #2a2a2a;
            border: 2px solid #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
        }
        .cell.active {
            background: #ff4e50;
            border-color: #ff888a;
            box-shadow: 0 0 10px rgba(255, 78, 80, 0.5);
        }
        /* 再生中の行ハイライト */
        .cell.playing-row {
            border-color: #ffd700;
        }
        /* 下部ボタンエリア */
        #action-bar {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        #play-btn {
            background: #4cd137;
            color: #fff;
        }
        #play-btn.playing {
            background: #e84118;
        }
        #clear-btn {
            background: #576574;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <h1>Beat Blocks Editor</h1>
            <div class="controls-top">
                <label>BPM: <input type="number" id="bpm-input" value="120" min="60" max="200"></label>
                <span id="status-text">停止中</span>
            </div>
        </header>

        <!-- ドットグリッド (4列 × 8ステップ) -->
        <div id="grid-editor"></div>

        <div id="action-bar">
            <button class="btn" id="clear-btn">クリア</button>
            <button class="btn" id="play-btn">再生 / プレビュー</button>
        </div>
    </div>

    <script>
        // --- 1. コアデータ構造 (Model) ---
        const steps = 8; // 8ステップ（2小節分相当）
        const lanes = 4; // 4つのレーン（ブロック）
        let bpm = 120;
        let isPlaying = false;
        let currentStep = 0;
        let timerId = null;

        // 2次元配列でグリッドの状態を保持 [step][lane] = true/false
        let patternData = Array.from({ length: steps }, () => Array(lanes).fill(false));

        // Web Audio APIを用いたサウンドエンジン
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 短い電子音（クリック音・ヒット音）を鳴らす関数
        function playSound(isAccent = false) {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            // アクセント（拍の頭など）で音程を変える
            osc.frequency.setValueAtTime(isAccent ? 440 : 330, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- 2. UI構築 (View) ---
        const gridEditor = document.getElementById('grid-editor');
        const cellElements = [];

        function buildGrid() {
            gridEditor.innerHTML = '';
            for (let s = 0; s < steps; s++) {
                cellElements[s] = [];
                for (let l = 0; l < lanes; l++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.step = s;
                    cell.dataset.lane = l;

                    // タップ/クリックでON/OFF切り替え
                    cell.addEventListener('pointerdown', () => {
                        patternData[s][l] = !patternData[s][l];
                        updateGridUI();
                    });

                    gridEditor.appendChild(cell);
                    cellElements[s][l] = cell;
                }
            }
        }

        function updateGridUI() {
            for (let s = 0; s < steps; s++) {
                for (let l = 0; l < lanes; l++) {
                    const cell = cellElements[s][l];
                    if (patternData[s][l]) {
                        cell.classList.add('active');
                    } else {
                        cell.classList.remove('active');
                    }

                    // 再生中の行の枠線をハイライト
                    if (isPlaying && s === currentStep) {
                        cell.classList.add('playing-row');
                    } else {
                        cell.classList.remove('playing-row');
                    }
                }
            }
        }

        // --- 3. 再生エンジン・タイミング制御 ---
        const playBtn = document.getElementById('play-btn');
        const statusText = document.getElementById('status-text');
        const bpmInput = document.getElementById('bpm-input');

        bpmInput.addEventListener('change', (e) => {
            bpm = parseInt(e.target.value) || 120;
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        });

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            patternData = Array.from({ length: steps }, () => Array(lanes).fill(false));
            updateGridUI();
        });

        function startPlayback() {
            initAudio();
            isPlaying = true;
            currentStep = 0;
            playBtn.textContent = "停止";
            playBtn.classList.add('playing');
            statusText.textContent = "再生中...";

            // 16分音符ごとのインターバル時間を計算 (60秒 / BPM / 4분割)
            const intervalMs = (60 / bpm / 4) * 1000;

            timerId = setInterval(() => {
                // 現在のステップでONになっているレーンがあれば音を鳴らす
                for (let l = 0; l < lanes; l++) {
                    if (patternData[currentStep][l]) {
                        playSound(l === 0); // レーン0は少し音程を変える
                    }
                }

                updateGridUI();

                // 次のステップへ進む
                currentStep = (currentStep + 1) % steps;
            }, intervalMs);
        }

        function stopPlayback() {
            isPlaying = false;
            clearInterval(timerId);
            playBtn.textContent = "再生 / プレビュー";
            playBtn.classList.remove('playing');
            statusText.textContent = "停止中";
            currentStep = 0;
            updateGridUI();
        }

        // 初期化実行
        buildGrid();
    </script>
</body>
</html>
